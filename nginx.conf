server {
  listen 80;
  root /usr/share/nginx/html;
  # The API: with REACT_APP_API_URL empty the app calls /api/... on this host, so forward it to the
  # backend's published port on the Docker host (in the QA/Staging sandbox: the backend's compose project).
  location /api/ {
    proxy_pass http://host.docker.internal:8000;
    proxy_set_header Host $host;
  }

  # Single-page app: unknown paths (e.g. /tasks) serve index.html, and React Router takes over.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
